<script>
/* Sun/moon toggle in the header; remembers the visitor's choice. */
(function(){
  var root = document.documentElement;
  var host = document.querySelector(".greedy-nav") || document.querySelector(".masthead__inner");
  if (!host) return;
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "theme-toggle";
  btn.innerHTML =
    '<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' +
    '<svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
  function label(){
    var dark = root.getAttribute("data-theme") === "dark";
    btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    btn.title = btn.getAttribute("aria-label");
  }
  btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    label();
  });
  /* Follow the device setting live, unless the visitor picked a theme. */
  if (window.matchMedia) {
    var mq = matchMedia("(prefers-color-scheme: dark)");
    var follow = function(e){
      var saved = null; try { saved = localStorage.getItem("theme"); } catch (err) {}
      if (!saved) { root.setAttribute("data-theme", e.matches ? "dark" : "light"); label(); }
    };
    if (mq.addEventListener) mq.addEventListener("change", follow);
  }
  label();
  var toggle = host.querySelector(".greedy-nav__toggle");
  if (toggle) host.insertBefore(btn, toggle); else host.appendChild(btn);
})();
</script>
